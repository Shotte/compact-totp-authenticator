<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compact TOTP Authenticator</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../rows.css">
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="optionsTitle"></h1>
      <button id="lockBtn" type="button" data-i18n="lock" hidden></button>
    </header>
    <p id="devNotice" class="note" data-i18n="devNotice"></p>
    <p id="message" role="status"></p>

    <section id="lockedView" hidden>
      <form id="setupForm" class="auth" autocomplete="off" hidden>
        <h2 data-i18n="setupTitle"></h2>
        <p class="warning" data-i18n="setupWarning"></p>
        <label><span data-i18n="newPassword"></span>
          <input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
        <label><span data-i18n="confirmPassword"></span>
          <input name="confirm" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
        <p class="note" data-i18n="passwordRules"></p>
        <div class="actions"><button type="submit" class="primary" data-i18n="setupButton"></button></div>
      </form>

      <form id="unlockForm" class="auth" autocomplete="off" hidden>
        <h2 data-i18n="lockedTitle"></h2>
        <label><span data-i18n="passwordLabel"></span>
          <input name="password" type="password" required maxlength="1024" autocomplete="current-password"></label>
        <div class="actions"><button type="submit" class="primary" data-i18n="unlockButton"></button></div>
      </form>

      <form id="recoveryForm" class="auth" autocomplete="off" hidden>
        <h2 data-i18n="recoverableTitle"></h2>
        <p class="warning" data-i18n="recoverableText"></p>
        <label><span data-i18n="passwordLabel"></span>
          <input name="password" type="password" required maxlength="1024" autocomplete="current-password"></label>
        <label class="check"><input name="confirmed" type="checkbox" required><span data-i18n="restoreConfirm"></span></label>
        <div class="actions"><button type="submit" class="primary" data-i18n="restoreButton"></button></div>
      </form>
    </section>

    <div id="unlockedView" hidden>
      <section>
        <h2 data-i18n="accounts"></h2>
        <table id="accounts">
          <thead><tr>
            <th data-i18n="colName"></th><th data-i18n="colSite"></th>
            <th data-i18n="colType"></th><th><span class="sr-only" data-i18n="colActions"></span></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2 id="formTitle" data-i18n="addAccount"></h2>
        <form id="accountForm" autocomplete="off">
          <label><span data-i18n="fieldName"></span><input name="name" required maxlength="100"></label>
          <label><span data-i18n="fieldSecret"></span>
            <input name="secret" type="password" spellcheck="false" autocomplete="off">
            <small id="secretHint" class="note" data-i18n="fieldSecretKeep" hidden></small>
            <small id="secretWeak" class="note" data-i18n="secretWeak" hidden></small>
          </label>
          <label><span data-i18n="fieldUrl"></span><input name="url" maxlength="200" placeholder="example.com"></label>
          <details>
            <summary data-i18n="advanced"></summary>
            <label><span data-i18n="fieldAlgorithm"></span>
              <select name="algorithm"><option>SHA-1</option><option>SHA-256</option><option>SHA-512</option></select></label>
            <label><span data-i18n="fieldDigits"></span>
              <select name="digits"><option>6</option><option>7</option><option>8</option></select></label>
            <label><span data-i18n="fieldPeriod"></span><input name="period" type="number" min="10" max="300" value="30"></label>
          </details>
          <div class="actions">
            <button type="submit" class="primary" data-i18n="save"></button>
            <button type="button" id="cancelEdit" data-i18n="cancel" hidden></button>
          </div>
        </form>
      </section>

      <section>
        <h2 data-i18n="importTitle"></h2>
        <p class="note" data-i18n="importPreviewNote"></p>
        <input id="importFile" type="file" accept=".json,application/json">
        <p id="importSummary"></p>
        <table id="preview" hidden>
          <thead><tr><th data-i18n="colName"></th><th data-i18n="colSite"></th><th data-i18n="colStatus"></th></tr></thead>
          <tbody></tbody>
        </table>
        <button id="importApply" type="button" data-i18n="importApply" disabled></button>
        <button id="importCancel" type="button" data-i18n="importCancel" hidden></button>
      </section>

      <section>
        <h2 data-i18n="exportTitle"></h2>
        <form id="exportForm" class="auth" autocomplete="off">
          <fieldset class="radios">
            <legend data-i18n="exportKind"></legend>
            <label><input type="radio" name="kind" value="encrypted" checked><span data-i18n="exportEncrypted"></span></label>
            <label><input type="radio" name="kind" value="plain"><span data-i18n="exportPlain"></span></label>
            <label><input type="radio" name="kind" value="legacy"><span data-i18n="exportLegacy"></span></label>
          </fieldset>
          <div id="exportEncryptedFields">
            <p class="note" data-i18n="exportEncryptedNote"></p>
            <label><span data-i18n="exportPassword"></span>
              <input name="exportPassword" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required></label>
            <label><span data-i18n="exportConfirm"></span>
              <input name="confirm" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required></label>
            <label class="check"><input name="useMasterPassword" type="checkbox"><span data-i18n="exportUseMaster"></span></label>
          </div>
          <div id="exportPlainFields" hidden>
            <p class="warning" data-i18n="exportPlainWarning"></p>
            <div id="legacyReport" hidden>
              <p id="legacyStatus"></p>
              <ul id="legacyList"></ul>
            </div>
            <label class="check"><input name="confirmed" type="checkbox"><span data-i18n="exportPlainConfirm"></span></label>
          </div>
          <label><span data-i18n="currentPassword"></span>
            <input name="password" type="password" required maxlength="1024" autocomplete="current-password"></label>
          <div class="actions"><button id="exportButton" type="submit" class="primary" data-i18n="exportButton"></button></div>
        </form>
      </section>

      <section>
        <h2 data-i18n="restoreExportTitle"></h2>
        <p class="note" data-i18n="restoreExportNote"></p>
        <form id="restoreExportForm" class="auth" autocomplete="off">
          <label><span data-i18n="exportFile"></span>
            <input name="file" type="file" accept=".json,application/json" required></label>
          <label><span data-i18n="exportPassword"></span>
            <input name="password" type="password" required maxlength="1024" autocomplete="off"></label>
          <label><span data-i18n="currentPassword"></span>
            <input name="masterPassword" type="password" required maxlength="1024" autocomplete="current-password"></label>
          <div class="actions"><button type="submit" data-i18n="restoreExportButton"></button></div>
        </form>
      </section>

      <section>
        <h2 data-i18n="changePasswordTitle"></h2>
        <form id="changeForm" class="auth" autocomplete="off">
          <label><span data-i18n="currentPassword"></span>
            <input name="current" type="password" required maxlength="1024" autocomplete="current-password"></label>
          <label><span data-i18n="newPassword"></span>
            <input name="next" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
          <label><span data-i18n="confirmPassword"></span>
            <input name="confirm" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
          <p class="note" data-i18n="changePasswordNote"></p>
          <div class="actions"><button type="submit" data-i18n="changePasswordButton"></button></div>
        </form>
      </section>
    </div>

    <form id="settingsForm">
      <section id="appearance">
        <h2 data-i18n="appearance"></h2>
        <p class="caption" data-i18n="previewLabel"></p>
        <!-- Static sample rows (no account data), styled exactly like the popup. -->
        <div class="preview" aria-hidden="true">
          <ul class="rows" id="appearancePreview">
            <li><div class="row"><span class="name">Example Mail 01</span><span class="code">719041</span><span class="icon"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 10.5V3a1 1 0 0 1 1-1h7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></div></li>
            <li class="current"><div class="row"><span class="name">Demo Cloud 02</span><span class="code">226358</span><span class="icon"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 10.5V3a1 1 0 0 1 1-1h7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></div></li>
            <li><div class="row"><span class="name">Placeholder Hosting with a long name 03</span><span class="code">46801892</span><span class="icon"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 10.5V3a1 1 0 0 1 1-1h7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></div></li>
          </ul>
        </div>

        <fieldset>
          <legend data-i18n="colorScheme"></legend>
          <div class="segmented">
            <label><input type="radio" name="theme" value="auto"><span data-i18n="themeAuto"></span></label>
            <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label>
            <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark"></span></label>
          </div>
        </fieldset>

        <fieldset class="plain">
          <label class="check"><input type="checkbox" name="customColors"><span data-i18n="customColors"></span></label>
          <div class="colors">
            <label><span data-i18n="colorFg"></span><input name="fg" type="color"></label>
            <label><span data-i18n="colorBg"></span><input name="bg" type="color"></label>
          </div>
          <p id="contrastNote" class="note" data-i18n="contrastAdjusted" hidden></p>
        </fieldset>

        <div class="slider">
          <label for="fontSize" data-i18n="fontSize"></label>
          <output id="fontSizeOut" for="fontSize"></output>
          <input id="fontSize" name="fontSize" type="range" min="12" max="20" step="1">
        </div>

        <fieldset class="radios">
          <legend data-i18n="rowHeight"></legend>
          <label><input type="radio" name="rowHeight" value="auto"><span data-i18n="rowAuto"></span></label>
          <label><input type="radio" name="rowHeight" value="22"><span data-i18n="row22"></span></label>
          <label><input type="radio" name="rowHeight" value="25"><span data-i18n="row25"></span></label>
          <label><input type="radio" name="rowHeight" value="30"><span data-i18n="row30"></span></label>
        </fieldset>
        <p id="rowNote" class="note" hidden></p>

        <button id="resetAppearance" type="button" data-i18n="resetAppearance"></button>
      </section>

      <section>
        <h2 data-i18n="behavior"></h2>
        <label><span data-i18n="sortOrder"></span>
          <select name="sort">
            <option value="manual" data-i18n="sortManual"></option>
            <option value="alpha" data-i18n="sortAlpha"></option>
            <option value="revalpha" data-i18n="sortRevalpha"></option>
          </select></label>
        <label><span data-i18n="autoLock"></span><input name="autoLockMinutes" type="number" min="1" max="240"></label>
        <label class="check"><input name="idleLock" type="checkbox"><span data-i18n="idleLock"></span></label>
        <label><span data-i18n="idleLockMinutes"></span><input name="idleLockMinutes" type="number" min="1" max="60"></label>
        <p class="note" data-i18n="idleLockNote"></p>
      </section>
    </form>
  </main>
</body>
</html>
