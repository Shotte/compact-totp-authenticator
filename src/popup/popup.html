<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compact TOTP Authenticator</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../rows.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <section id="locked" hidden>
    <p class="title" data-i18n="lockedTitle"></p>
    <button id="unlockDemo" type="button" data-i18n="unlockDemo"></button>
    <p class="note" data-i18n="demoNote"></p>
  </section>

  <section id="unlocked" hidden>
    <ul id="list" class="rows" tabindex="-1"></ul>
    <footer>
      <span id="ticker" data-i18n-attr="title:secondsLeft"></span>
      <button id="lock" class="icon-btn" type="button" data-i18n-attr="title:lock;aria-label:lock">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.2" fill="currentColor"/><path d="M5.2 7V5.2a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button id="settings" class="icon-btn" type="button" data-i18n-attr="title:settings;aria-label:settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.2v2.4M8 12.4v2.4M1.2 8h2.4M12.4 8h2.4M3.2 3.2l1.7 1.7M11.1 11.1l1.7 1.7M3.2 12.8l1.7-1.7M11.1 4.9l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </section>

  <p id="announce" class="sr-only" aria-live="polite"></p>

  <template id="copyIcon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 10.5V3a1 1 0 0 1 1-1h7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></template>
  <template id="checkIcon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></template>
</body>
</html>
